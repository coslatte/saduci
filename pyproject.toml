[project]
name = "sadeci-core"
version = "0.1.0"
description = "Clinical intelligence backend for ICU settings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.37",
    "uvicorn>=0.41.0",
    "simuci>=1.0.1",
    "scipy>=1.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
sadeci-init = "main:main"
