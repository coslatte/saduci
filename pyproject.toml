[project]
name = "sadeci-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "passlib>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.22",
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.37",
    "uvicorn>=0.41.0",
    "simuci>=1.0.1",
    "scipy>=1.11",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[project.scripts]
sadeci-init = "main:main"
