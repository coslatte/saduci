+services:
+  - type: web
+    name: api-gateway
+    env: docker
+    dockerfilePath: src/api-gateway/Dockerfile
+    dockerCommand: python src/api-gateway/main.py
+    envVars:
+      - key: PORT
+        value: "8000"
+      - key: SECRET_KEY
+        sync: false
+      - key: AUTH_USERNAME
+        sync: false
+      - key: AUTH_PASSWORD
+        sync: false
+      - key: DATABASE_URL
+        sync: false
+      - key: CORS_ALLOW_ORIGINS
+        value: "http://localhost:3000,http://localhost:8000"
+      - key: CORS_ALLOW_CREDENTIALS
+        value: "true"
+      - key: PREDICTION_SERVICE_URL
+        value: http://prediction:8002
+      - key: SIMULATION_SERVICE_URL
+        value: http://simulation:8003
+
+  - type: web
+    name: prediction
+    env: docker
+    dockerfilePath: src/prediction/Dockerfile
+    dockerCommand: python src/prediction/main.py
+    envVars:
+      - key: PORT
+        value: "8002"
+      - key: DATABASE_URL
+        sync: false
+      - key: PREDICTION_NARRATIVE_PROVIDER
+        value: stub
+
+  - type: web
+    name: simulation
+    env: docker
+    dockerfilePath: src/simulation/Dockerfile
+    dockerCommand: python src/simulation/main.py
+    envVars:
+      - key: PORT
+        value: "8003"
+      - key: DATABASE_URL
+        sync: false
