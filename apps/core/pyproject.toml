[project]
name = "saduci-core"
version = "0.0.0"
description = "SADUCI backend monorepo — parent project"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "src/shared_core",
    "src/api-gateway",
    "src/user",
    "src/patient",
    "src/prediction",
    "src/simulation",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
