# SADUCI Core — microservicios backend y sus bases de datos.
#
# Desde este directorio:
#   docker compose up -d --build          # gateway + 4 microservicios + 4 Postgres
#   docker compose --profile platform up -d --build   # además el frontend Next.js
#   docker compose down                   # detener (conserva los volúmenes)
#
# El frontend tiene su propio ciclo de vida en desarrollo:
#   cd ../platform && bun run dev         # http://localhost:4000
#
# Variables de entorno en apps/core/.env (copiar de .env.example).
name: saduci

services:
  # ─── API Gateway ──────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./src/api-gateway
      additional_contexts:
        core: .
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:-7000}:7000"
    environment:
      - PORT=7000
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:4000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-5}
      - LOGIN_RATE_LIMIT_WINDOW=${LOGIN_RATE_LIMIT_WINDOW:-60}
      - USER_SERVICE_URL=http://user-service:7001
      - PATIENT_SERVICE_URL=http://patient-service:7002
      - PREDICTION_SERVICE_URL=http://prediction-service:7003
      - SIMULATION_SERVICE_URL=http://simulation-service:7004
    depends_on:
      user-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      prediction-service:
        condition: service_healthy
      simulation-service:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── User Service ─────────────────────────────────────────────────────
  user-service:
    build:
      context: ./src/user
      dockerfile: Dockerfile
      additional_contexts:
        core: .
    container_name: user-service
    ports:
      - "127.0.0.1:${USER_HOST_PORT:-7001}:7001"
    environment:
      - PORT=7001
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - AUTH_USERNAME=${AUTH_USERNAME:?AUTH_USERNAME is required}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      # Dialecto explicito: SQLAlchemy 2 resuelve `postgresql://` a psycopg v3,
      # pero el servicio declara e instala psycopg2-binary.
      - DATABASE_URL=postgresql+psycopg2://user_user:${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}@user-db:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-db:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16.3-alpine}
    container_name: user-db
    environment:
      - POSTGRES_USER=user_user
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      - POSTGRES_DB=user_db
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Patient Service ──────────────────────────────────────────────────
  patient-service:
    build:
      context: ./src/patient
      dockerfile: Dockerfile
      additional_contexts:
        core: .
    container_name: patient-service
    ports:
      - "127.0.0.1:${PATIENT_HOST_PORT:-7002}:7002"
    environment:
      - PORT=7002
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      # El servicio patient usa create_async_engine: requiere dialecto +asyncpg
      - DATABASE_URL=postgresql+asyncpg://patient_user:${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}@patient-db:5432/patient_db
    depends_on:
      patient-db:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  patient-db:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16.3-alpine}
    container_name: patient-db
    environment:
      - POSTGRES_USER=patient_user
      - POSTGRES_PASSWORD=${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      - POSTGRES_DB=patient_db
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_user -d patient_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Prediction Service ───────────────────────────────────────────────
  prediction-service:
    build:
      context: ./src/prediction
      dockerfile: Dockerfile
      additional_contexts:
        core: .
    container_name: prediction-service
    ports:
      - "127.0.0.1:${PREDICTION_HOST_PORT:-7003}:7003"
    environment:
      - PORT=7003
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+psycopg2://prediction_user:${PREDICTION_DB_PASSWORD:?PREDICTION_DB_PASSWORD is required}@prediction-db:5432/prediction_db
      - PREDICTION_NARRATIVE_PROVIDER=${PREDICTION_NARRATIVE_PROVIDER:-embedded}
      - PREDICTION_NARRATIVE_MODEL=${PREDICTION_NARRATIVE_MODEL:-qwen2.5-1.5b-instruct-q4_k_m}
      - PREDICTION_NARRATIVE_MODEL_PATH=/app/models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - PREDICTION_LLM_THREADS=${PREDICTION_LLM_THREADS:-4}
      - PREDICTION_LLM_MAX_TOKENS=${PREDICTION_LLM_MAX_TOKENS:-120}
      - PREDICTION_LOCAL_LLM_URL=${PREDICTION_LOCAL_LLM_URL:-}
      - PREDICTION_LOCAL_LLM_MODEL=${PREDICTION_LOCAL_LLM_MODEL:-}
      - PREDICTION_LOCAL_LLM_TOKEN=${PREDICTION_LOCAL_LLM_TOKEN:-}
      - PREDICTION_LOCAL_LLM_TIMEOUT_SECONDS=${PREDICTION_LOCAL_LLM_TIMEOUT_SECONDS:-60}
      - PREDICTION_GEMINI_API_KEY=${PREDICTION_GEMINI_API_KEY:-}
      - PREDICTION_GEMINI_MODEL=${PREDICTION_GEMINI_MODEL:-gemini-2.5-flash}
      - PREDICTION_GEMINI_TIMEOUT_SECONDS=${PREDICTION_GEMINI_TIMEOUT_SECONDS:-60}
      - HUGGINGFACE_API_URL=${HUGGINGFACE_API_URL:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - HUGGINGFACE_TIMEOUT_SECONDS=${HUGGINGFACE_TIMEOUT_SECONDS:-30}
      - PREDICTION_MODEL_PATH=/app/models/v1/new_workflow.joblib
      - GATEWAY_URL=http://api-gateway:7000
    volumes:
      - prediction-narrative-model:/app/models/llm
    depends_on:
      prediction-db:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  prediction-db:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16.3-alpine}
    container_name: prediction-db
    environment:
      - POSTGRES_USER=prediction_user
      - POSTGRES_PASSWORD=${PREDICTION_DB_PASSWORD:?PREDICTION_DB_PASSWORD is required}
      - POSTGRES_DB=prediction_db
    volumes:
      - prediction-db-data:/var/lib/postgresql/data
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prediction_user -d prediction_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Simulation Service ───────────────────────────────────────────────
  simulation-service:
    build:
      context: ./src/simulation
      dockerfile: Dockerfile
      additional_contexts:
        core: .
    container_name: simulation-service
    ports:
      - "127.0.0.1:${SIMULATION_HOST_PORT:-7004}:7004"
    environment:
      - PORT=7004
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+psycopg2://simulation_user:${SIMULATION_DB_PASSWORD:?SIMULATION_DB_PASSWORD is required}@simulation-db:5432/simulation_db
      - GATEWAY_URL=http://api-gateway:7000
    depends_on:
      simulation-db:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7004/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  simulation-db:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16.3-alpine}
    container_name: simulation-db
    environment:
      - POSTGRES_USER=simulation_user
      - POSTGRES_PASSWORD=${SIMULATION_DB_PASSWORD:?SIMULATION_DB_PASSWORD is required}
      - POSTGRES_DB=simulation_db
    volumes:
      - simulation-db-data:/var/lib/postgresql/data
    networks:
      - saduci-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulation_user -d simulation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Platform (Next.js) ───────────────────────────────────────────────
  # Perfil 'platform': NO se levanta con `docker compose up`. En desarrollo el
  # frontend corre por su cuenta con `bun run dev` (puerto 4000), y así sus
  # logs y su recarga en caliente se ven en la terminal. Este perfil existe para
  # el despliegue completo en un servidor.
  platform:
    profiles: ["platform"]
    build:
      context: ../platform
      dockerfile: Dockerfile
    container_name: saduci-platform
    ports:
      - "${PLATFORM_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api-gateway:7000
      - PORT=3000
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - saduci-network
    restart: unless-stopped

networks:
  saduci-network:
    driver: bridge

volumes:
  user-db-data:
  patient-db-data:
  prediction-db-data:
  prediction-narrative-model:
  simulation-db-data:
