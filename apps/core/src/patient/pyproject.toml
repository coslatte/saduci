[project]
name = "patients-service"
version = "0.0.0"
description = "Patient service for the SADUCI monorepo"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.42.0",
    "sqlalchemy[asyncio]>=2.0.37",
    "shared-core>=0.0.0",
    "pydantic>=2.12.0",
    "psycopg2-binary>=2.9.0",
    # app/models/database.py usa create_async_engine -> requiere driver async
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.uvicorn]
host = "0.0.0.0"
port = 7002

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
