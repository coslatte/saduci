[project]
name = "prediction-service"
version = "0.0.0"
description = "Prediction service for the SADUCI monorepo"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.42.0",
    "sqlalchemy>=2.0.37",
    "shared-core>=0.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.2.0",
    "pydantic>=2.12.0",
    "httpx>=0.27.0",
    "scikit-learn==1.6.1",
    "joblib>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "simuci>=0.0.0",
    "alembic>=1.13.0",
    "llama-cpp-python==0.3.36",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.uvicorn]
host = "0.0.0.0"
port = 7003

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
