[project]
name = "users-service"
version = "1.0.0"
description = "User management and authentication service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.37",
    "shared-core",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.2.0",
    "pydantic>=2.10.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
