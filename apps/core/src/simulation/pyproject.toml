[project]
name = "simulation-service"
version = "0.0.0"
description = "Clinical simulation service for ICU settings"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.41.0",
    "sqlalchemy>=2.0.37",
    "shared-core>=0.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.2.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.2.3",
    "simuci>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
